<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 573" width="336" height="573">
  <defs>
    <!-- MASK FOR SCALLOPS AND TEAR NOTCHES -->
    <mask id="ticket-mask-design-4">
      <!-- White base covering ticket with rounded corners -->
      <rect x="0" y="0" width="336" height="573" rx="20" ry="20" fill="white"/>
      <!-- Top Scalloped Edge Cutouts -->
      <circle cx="48" cy="0" r="10" fill="black"/><circle cx="96" cy="0" r="10" fill="black"/><circle cx="144" cy="0" r="10" fill="black"/><circle cx="192" cy="0" r="10" fill="black"/><circle cx="240" cy="0" r="10" fill="black"/><circle cx="288" cy="0" r="10" fill="black"/>
      <!-- Bottom Scalloped Edge Cutouts -->
      <circle cx="48" cy="573" r="10" fill="black"/><circle cx="96" cy="573" r="10" fill="black"/><circle cx="144" cy="573" r="10" fill="black"/><circle cx="192" cy="573" r="10" fill="black"/><circle cx="240" cy="573" r="10" fill="black"/><circle cx="288" cy="573" r="10" fill="black"/>
      <!-- Left Notch at Tear Line (y=112) -->
      <circle cx="0" cy="112" r="16" fill="black"/>
      <!-- Right Notch at Tear Line (y=112) -->
      <circle cx="336" cy="112" r="16" fill="black"/>
    </mask>
  </defs>

  <!-- CLIPPED TICKET BODY -->
  <g mask="url(#ticket-mask-design-4)">
    <!-- BACKGROUND -->
    
      <defs>
        <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#021a12"/>
          <stop offset="50%" stop-color="#062e20"/>
          <stop offset="100%" stop-color="#03160f"/>
        </linearGradient>
        <pattern id="topo4" width="60" height="60" patternUnits="userSpaceOnUse">
          <path d="M0,30 Q15,10 30,30 T60,30" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.18"/>
          <path d="M0,15 Q15,35 30,15 T60,15" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12"/>
        </pattern>
      </defs>
      <rect width="336" height="573" fill="url(#grad4)"/>
      <rect width="336" height="573" fill="url(#topo4)"/>
      <circle cx="60" cy="450" r="140" fill="#10b981" opacity="0.12"/>
    

    <!-- TOP SECTION: NITROXX TICKETS LOGO -->
    <g transform="translate(116, 44)">
      <!-- Nitroxx Logo Graphic -->
      <text x="0" y="24" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#d1fae5" letter-spacing="-0.5">
        Nitro
      </text>
      <!-- Stylized double X racing mark -->
      <g transform="translate(56, 4)">
        <path d="M 4 2 L 18 22 M 18 2 L 4 22" stroke="#d1fae5" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 16 2 L 30 22 M 30 2 L 16 22" stroke="#d1fae5" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="11" fill="#d1fae5" letter-spacing="0.5">
        Tickets
      </text>
    </g>

    <!-- HORIZONTAL PERFORATION DASHED TEAR LINE (y=112) -->
    <line x1="20" y1="112" x2="316" y2="112" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6, 6"/>

    <!-- MIDDLE SECTION: EVENT DETAILS -->
    <g transform="translate(32, 160)">
      <!-- Title (2 lines max with bold styling) -->
      <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#d1fae5" letter-spacing="0.2">
        IT COMES WITH IT MIC...
      </text>
      
      <text x="0" y="24" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#d1fae5" letter-spacing="0.2">
         MCCLURE
      </text>
      

      <!-- Venue / Location -->
      <text x="0" y="52" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="13" fill="#d1fae5" opacity="0.95">
        Gateway of India, Colaba
      </text>
    </g>

    <!-- HORIZONTAL DIVIDER 1 -->
    <line x1="32" y1="236" x2="304" y2="236" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.85"/>

    <!-- 3 COLUMNS: DATE, TIME, TICKETS -->
    <g transform="translate(32, 258)">
      <!-- Col 1: Date -->
      <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="13" fill="#d1fae5">
        Date
      </text>
      <text x="0" y="20" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="17" fill="#d1fae5">
        08/12
      </text>

      <!-- Col 2: Time -->
      <text x="96" y="0" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="13" fill="#d1fae5">
        Time
      </text>
      <text x="96" y="20" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="17" fill="#d1fae5">
        02:00 PM
      </text>

      <!-- Col 3: Tickets -->
      <text x="204" y="0" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="13" fill="#d1fae5">
        Tickets
      </text>
      <text x="204" y="20" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="17" fill="#d1fae5">
        x2
      </text>
    </g>

    <!-- HORIZONTAL DIVIDER 2 -->
    <line x1="32" y1="292" x2="304" y2="292" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.85"/>

